<!-- Signature ribbon: drop this inside any section that has position:relative; overflow:hidden -->
<style>
@keyframes sigRibbon{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
@keyframes sigFloat{from{transform:translateY(-16px)}to{transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){.sig-ribbon *{animation:none!important}}
.sig-ribbon{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sig-ribbon .float{animation:sigFloat 14s ease-in-out infinite alternate}
.sig-ribbon .r1{animation:sigRibbon 34s linear infinite}
.sig-ribbon .r2{animation:sigRibbon 34s linear -17s infinite}
</style>
