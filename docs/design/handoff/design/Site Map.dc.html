<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>
@font-face{font-family:"Nohemi";src:url("assets/fonts/Nohemi-VF.ttf") format("truetype");font-weight:100 900}
body{margin:0;background:#E6E6E1;font-family:"Nohemi",system-ui,sans-serif;color:#1F211C}
a{color:#1F211C}a:hover{color:#C6241C}
</style>
</helmet>
<section style="padding:64px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <h1 style="margin:0;font-size:32px;font-weight:550;letter-spacing:-0.02em">Sunshine Facilities Group · All pages</h1>
    <p style="margin:0;font-size:16px;color:#45473F">Desktop 1440 and mobile 360 for each page. Click a title to open the live page.</p>
  </div>
  <sc-for list="{{ pages }}" as="p" hint-placeholder-count="8">
    <div id="{{ p.id }}" style="display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:10px"><span style="background:#1F211C;color:#FFFFFF;font-size:13px;font-weight:600;padding:4px 9px;border-radius:4px">{{ p.n }}</span><a href="{{ p.file }}" style="font-size:20px;font-weight:550">{{ p.title }}</a></div>
      <div style="display:flex;gap:48px;align-items:flex-start">
        <iframe src="{{ p.file }}" title="{{ p.title }} desktop" loading="lazy" style="width:1440px;height:{{ p.dh }}px;border:0;background:#FFFFFF;box-shadow:0 30px 60px -30px rgba(31,33,28,0.35);border-radius:4px"></iframe>
        <iframe src="{{ p.file }}" title="{{ p.title }} mobile" loading="lazy" style="width:360px;height:{{ p.mh }}px;border:0;background:#FFFFFF;box-shadow:0 30px 60px -30px rgba(31,33,28,0.35);border-radius:4px"></iframe>
      </div>
    </div>
  </sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PAGES = [['Home', 'SFG%20Home%20v2.dc.html'], ['Services', 'Services.dc.html'], ['Service detail (Facility Management)', 'Service%20Detail.dc.html?line=facility'], ['Industries', 'Industries.dc.html'], ['About Us', 'About.dc.html'], ['Careers', 'Careers.dc.html'], ['Contact / Request a Quotation', 'Contact.dc.html'], ['Admin CMS', 'Admin%20CMS.dc.html']];
class Component extends DCLogic {
  renderVals() {
    return { pages: PAGES.map((p, i) => ({ n: String(i + 1).padStart(2, '0'), id: 'p' + (i + 1), title: p[0], file: p[1], dh: i === 7 ? 900 : 1200, mh: i === 7 ? 800 : 1200 })) };
  }
}
</script>
</body>
</html>
