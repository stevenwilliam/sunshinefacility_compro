<sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><dc-import name="SFG Home v2" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isServices }}" hint-placeholder-val="{{ false }}"><dc-import name="Services" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isDetail }}" hint-placeholder-val="{{ false }}"><dc-import name="Service Detail" line="{{ line }}" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isIndustries }}" hint-placeholder-val="{{ false }}"><dc-import name="Industries" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}"><dc-import name="About" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isCareers }}" hint-placeholder-val="{{ false }}"><dc-import name="Careers" hint-size="100%,100vh"></dc-import></sc-if>
<sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}"><dc-import name="Contact" hint-size="100%,100vh"></dc-import></sc-if>

<script type="text/x-dc" data-dc-script>
const FILE_ROUTE = { 'sfg home v2': 'home', 'services': 'services', 'service detail': 'detail', 'industries': 'industries', 'about': 'about', 'careers': 'careers', 'contact': 'contact' };
const LINES = ['food', 'digital', 'workforce', 'remote', 'facility'];
const parseHash = h => {
  const m = (h || '').match(/^#\/([a-z]+)(?:\/([a-z]+))?/);
  if (!m) return null;
  if (m[1] === 'service') return { page: 'detail', line: LINES.includes(m[2]) ? m[2] : 'facility' };
  return Object.values(FILE_ROUTE).includes(m[1]) ? { page: m[1], line: null } : null;
};
const toHash = r => r.page === 'detail' ? '#/service/' + r.line : r.page === 'home' ? '#/' : '#/' + r.page;
class Component extends DCLogic {
  state = { page: 'home', line: 'facility' };
  componentDidMount() {
    const r = parseHash(location.hash); if (r) this.setState({ page: r.page, line: r.line || 'facility' });
    this.onHash = () => { const r2 = parseHash(location.hash); if (r2) { this.setState({ page: r2.page, line: r2.line || this.state.line }); window.scrollTo(0, 0); } else if (location.hash === '#/' || location.hash === '') { this.setState({ page: 'home' }); } };
    window.addEventListener('hashchange', this.onHash);
    this.onClick = e => {
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const href = a.getAttribute('href') || '';
      const m = href.match(/^(?:\.\/)?([^?#\/]+)\.dc\.html(?:\?line=([a-z]+))?/i); if (!m) return;
      const page = FILE_ROUTE[decodeURIComponent(m[1]).toLowerCase()]; if (!page) return;
      e.preventDefault();
      const line = page === 'detail' ? (LINES.includes(m[2]) ? m[2] : 'facility') : null;
      const hash = toHash({ page, line });
      if (location.hash === hash) window.scrollTo(0, 0); else location.hash = hash;
    };
    document.addEventListener('click', this.onClick, true);
    if (window.__resources) {
      const FONT_RULE = /@font-face\s*\{[^}]*url\(["']?assets\/fonts\/[^}]*\}/g;
      const dead = n => {
        if (n.tagName === 'STYLE' && FONT_RULE.test(n.textContent || '')) { FONT_RULE.lastIndex = 0; n.textContent = n.textContent.replace(FONT_RULE, ''); }
        FONT_RULE.lastIndex = 0;
        return n.tagName === 'LINK' && /assets\/(vendor|fonts)\//.test(n.getAttribute('href') || '');
      };
      const sweep = root => root.querySelectorAll && root.querySelectorAll('link,style').forEach(n => { if (dead(n)) n.remove(); });
      sweep(document);
      this.mo = new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType !== 1) return; if (dead(n)) n.remove(); else sweep(n); })));
      this.mo.observe(document.documentElement, { childList: true, subtree: true });
    }
  }
  componentWillUnmount() { window.removeEventListener('hashchange', this.onHash); document.removeEventListener('click', this.onClick, true); if (this.mo) this.mo.disconnect(); }
  renderVals() {
    const p = this.state.page;
    return { isHome: p === 'home', isServices: p === 'services', isDetail: p === 'detail', isIndustries: p === 'industries', isAbout: p === 'about', isCareers: p === 'careers', isContact: p === 'contact', line: this.state.line };
  }
}
</script>
