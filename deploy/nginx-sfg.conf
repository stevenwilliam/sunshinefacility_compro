# sfg — nginx reverse proxy (development server).
#
# Copy to /etc/nginx/sites-available/sfg and symlink into sites-enabled.
# The Go service binds 127.0.0.1:8098; nginx is the only way in.
# Production uses docs/13-production-deployment-handbook.md instead: TLS on
# 443 for www.sunshinefacility.com, no allowlist (it is a public website).

upstream sfg_app {
    server 127.0.0.1:8098;
    keepalive 16;
}

# Edge rate limits in series with the application's own: the app limiter
# protects an account or a form, these protect the box.
limit_req_zone $binary_remote_addr zone=sfg_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sfg_forms:10m rate=20r/m;

server {
    # Port 8097: the sole listener, so http://<server-ip>:8097/ reaches this
    # site with no DNS (the shape the other projects use on 8090–8095).
    listen 8097;
    listen [::]:8097;
    server_name sfg.sfg.local _;

    # Dev server only: the LAN and the VMware host adapter Steven arrives from
    # (172.16.0.1 — see 99-steven-preference.md §9). A public site in
    # production has no allowlist.
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.88.0/24;
    allow 172.16.0.0/24;
    deny all;

    client_max_body_size 52m;   # media uploads (the app caps them by parameter)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /api/v1/auth/login {
        limit_req zone=sfg_auth burst=5 nodelay;
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
    }
    location ~ ^/api/v1/public/(quotation|application)$ {
        limit_req zone=sfg_forms burst=10 nodelay;
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
