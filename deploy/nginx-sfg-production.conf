# sfg — production (119.8.189.246) → 127.0.0.1:8098
# /etc/nginx/sites-available/sfg, symlinked into sites-enabled.
#
# Canonical host: www.sunshinefacility.com (D41). Every other name answers
# with a 301 to it, keeping the path: the apex, both www and apex of
# sunshinefacility.co.id and sunshinefacility.id, and the old temporary
# domain sunshinefacility.sunshinefood.co.id (so links already shared still
# work).
#
# TLS: Cloudflare proxies all three zones, SSL mode Full (strict). Each zone
# has a Cloudflare Origin Certificate (covers the apex and *.zone) in
# /etc/ssl/sfg/<zone>.pem + .key. The temporary domain keeps its Let's
# Encrypt certificate, renewed by certbot's webroot as before.
# ssl_session_cache shared:SSL is declared here, once for the whole host.

server {
    listen 80;
    listen [::]:80;
    server_name www.sunshinefacility.com sunshinefacility.com
                www.sunshinefacility.co.id sunshinefacility.co.id
                www.sunshinefacility.id sunshinefacility.id
                sunshinefacility.sunshinefood.co.id;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.sunshinefacility.com$request_uri; }
}

upstream sfg_app {
    server 127.0.0.1:8098;
    keepalive 16;
}

# Edge rate limits in series with the application's own (per visitor IP,
# which cloudflare-realip.conf restores).
limit_req_zone $binary_remote_addr zone=sfg_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sfg_forms:10m rate=20r/m;

# ---------------------------------------------------------------- redirects

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sunshinefacility.com;
    ssl_certificate     /etc/ssl/sfg/sunshinefacility.com.pem;
    ssl_certificate_key /etc/ssl/sfg/sunshinefacility.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.sunshinefacility.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sunshinefacility.co.id sunshinefacility.co.id;
    ssl_certificate     /etc/ssl/sfg/sunshinefacility.co.id.pem;
    ssl_certificate_key /etc/ssl/sfg/sunshinefacility.co.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.sunshinefacility.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sunshinefacility.id sunshinefacility.id;
    ssl_certificate     /etc/ssl/sfg/sunshinefacility.id.pem;
    ssl_certificate_key /etc/ssl/sfg/sunshinefacility.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.sunshinefacility.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sunshinefacility.sunshinefood.co.id;
    ssl_certificate     /etc/letsencrypt/live/sunshinefacility.sunshinefood.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sunshinefacility.sunshinefood.co.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://www.sunshinefacility.com$request_uri;
}

# ---------------------------------------------------------------- the site

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sunshinefacility.com;

    ssl_certificate     /etc/ssl/sfg/sunshinefacility.com.pem;
    ssl_certificate_key /etc/ssl/sfg/sunshinefacility.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 52m;   # media uploads (the app caps them by parameter)

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /api/v1/auth/login {
        limit_req zone=sfg_auth burst=5 nodelay;
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
    }
    location ~ ^/api/v1/public/(quotation|application)$ {
        limit_req zone=sfg_forms burst=10 nodelay;
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://sfg_app;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
